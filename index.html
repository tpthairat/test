        } catch (e) {

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Expose Firebase to Window for React Component

            onAuthStateChanged,
            collection,

        // --- Helper: CSV Parser ---
        const parseCSV = (text) => {
            const lines = text.split('\n');
            const result = [];
            const startRow = lines[0].toLowerCase().includes('question') ? 1 : 0;
            for (let i = startRow; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                const clean = (str) => str ? str.replace(/^"|"$/g, '').trim() : "";
                if (parts.length >= 7) {
                    result.push({
                        category: parts.length >= 9 ? clean(parts[1]) : 'ทั่วไป', 
                        question: clean(parts.length >= 9 ? parts[2] : parts[0]),
                        options: [
                            clean(parts.length >= 9 ? parts[3] : parts[1]), 
                            clean(parts.length >= 9 ? parts[4] : parts[2]), 
                            clean(parts.length >= 9 ? parts[5] : parts[3]), 
                            clean(parts.length >= 9 ? parts[6] : parts[4])
                        ],
                        correctAnswer: parseInt(clean(parts.length >= 9 ? parts[7] : parts[5])) - 1, 
                        explanation: clean(parts.length >= 9 ? parts[8] : parts[6]),
                        createdAt: Date.now() + i
                    });
                }
            }
            return result;
        };

                    ) : authError ? (
                        <div className="mx-4 flex flex-col items-center justify-center text-red-500 bg-red-50 rounded-3xl p-6 border border-red-200 shadow-sm max-w-2xl mx-auto">
                            <Icons.AlertCircle size={40} className="mb-3 md:w-12 md:h-12" />
                            <h3 className="text-base md:text-lg font-bold">เกิดข้อผิดพลาดในการเชื่อมต่อ</h3>
                            <p className="text-xs md:text-sm mb-2 font-mono bg-red-100/50 p-2 rounded">{authError}</p>
                            <p className="text-xs text-slate-500 mt-2">โปรดตรวจสอบการตั้งค่า Firebase</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 max-w-4xl mx-auto w-full px-2 sm:px-4">
                            {/* Exam Buttons */}
                            <button 
                                onClick={() => onSelectPart('A')}
                                className="group relative bg-white/80 backdrop-blur-xl p-5 md:p-6 rounded-[1.5rem] shadow-lg hover:shadow-2xl hover:shadow-blue-500/20 transition-all duration-300 transform active:scale-[0.98] md:hover:-translate-y-2 text-left border border-white/50 overflow-hidden"
                            >
                                <div className="absolute top-0 right-0 w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-bl-[3rem] -mr-6 -mt-6 transition-all group-hover:scale-110"></div>
                                <div className="relative z-10">
                                    <div className="flex items-center justify-between mb-3 md:mb-4">
                                        <div className="p-3 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl shadow-lg text-white group-hover:scale-110 transition-transform">
                                            <Icons.GraduationCap size={24} />
                                        </div>
                                        <span className="bg-blue-50 text-blue-700 px-2 py-1 rounded-full text-xs font-bold">{fileStats.A || 0} ชุด</span>
                                    </div>
                                    <h2 className="text-lg md:text-xl font-bold text-gray-800 mb-1 group-hover:text-blue-700 transition-colors">ภาค ก</h2>
                                    <p className="text-gray-500 text-xs md:text-sm mb-3 line-clamp-1">ความรู้ความสามารถทั่วไป</p>
                                    <div className="flex items-center text-blue-600 font-semibold text-xs md:text-sm">
                                        เริ่มสอบ <Icons.ChevronRight size={14} className="ml-1" />
                                    </div>
                                </div>
                            </button>

                            <button 
                                onClick={() => onSelectPart('B')}
                                className="group relative bg-white/80 backdrop-blur-xl p-5 md:p-6 rounded-[1.5rem] shadow-lg hover:shadow-2xl hover:shadow-purple-500/20 transition-all duration-300 transform active:scale-[0.98] md:hover:-translate-y-2 text-left border border-white/50 overflow-hidden"
                            >
                                <div className="absolute top-0 right-0 w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-purple-400/20 to-pink-400/20 rounded-bl-[3rem] -mr-6 -mt-6 transition-all group-hover:scale-110"></div>
                                <div className="relative z-10">
                                    <div className="flex items-center justify-between mb-3 md:mb-4">
                                        <div className="p-3 bg-gradient-to-br from-purple-500 to-fuchsia-600 rounded-2xl shadow-lg text-white group-hover:scale-110 transition-transform">
                                            <Icons.Briefcase size={24} />
                                        </div>
                                        <span className="bg-purple-50 text-purple-700 px-2 py-1 rounded-full text-xs font-bold">{fileStats.B || 0} ชุด</span>
                                    </div>
                                    <h2 className="text-lg md:text-xl font-bold text-gray-800 mb-1 group-hover:text-purple-700 transition-colors">ภาค ข</h2>
                                    <p className="text-gray-500 text-xs md:text-sm mb-3 line-clamp-1">ความรู้เฉพาะตำแหน่ง</p>
                                    <div className="flex items-center text-purple-600 font-semibold text-xs md:text-sm">
                                        เริ่มสอบ <Icons.ChevronRight size={14} className="ml-1" />
                                    </div>
                                </div>
                            </button>

                            {/* Summary & Analysis Buttons */}
                            <button 
                                onClick={goToSummary}
                                className="group bg-white/70 backdrop-blur-md p-4 rounded-[1.5rem] shadow hover:shadow-lg border border-white/60 flex items-center gap-4 transition-all hover:bg-white active:scale-95"
                            >
                                <div className="p-3 bg-orange-100 text-orange-600 rounded-xl group-hover:bg-orange-500 group-hover:text-white transition-colors">
                                    <Icons.FileText size={20} />
                                </div>
                                <div className="text-left">
                                    <h3 className="font-bold text-slate-700 group-hover:text-orange-600 transition-colors">สรุปเนื้อหา</h3>
                                    <p className="text-xs text-slate-500">ทบทวนบทเรียน</p>
                                </div>
                            </button>

                            <button 
                                onClick={goToAnalysis}
                                className="group bg-white/70 backdrop-blur-md p-4 rounded-[1.5rem] shadow hover:shadow-lg border border-white/60 flex items-center gap-4 transition-all hover:bg-white active:scale-95"
                            >
                                <div className="p-3 bg-green-100 text-green-600 rounded-xl group-hover:bg-green-500 group-hover:text-white transition-colors">
                                    <Icons.BarChart size={20} />
                                </div>
                                <div className="text-left">
                                    <h3 className="font-bold text-slate-700 group-hover:text-green-600 transition-colors">วิเคราะห์ผล</h3>
                                    <p className="text-xs text-slate-500">ดูสถิติการสอบ</p>
                                </div>
                            </button>
                        </div>
                    )}

                    <div className="mt-8 text-slate-500 text-xs md:text-sm flex items-center justify-center gap-2 font-medium pb-4">
                        <Icons.Info size={14} />
                        <span>เกณฑ์การผ่าน 60% ในแต่ละชุดวิชา</span>
                    </div>
                </div>
            </div>
        );

        const SummaryScreen = ({ onBack }) => {
            const [openId, setOpenId] = useState(null);

            return (
                <div className="min-h-screen p-4 flex flex-col items-center pt-8 overflow-y-auto">
                     <div className="w-full max-w-3xl bg-white/90 backdrop-blur-xl p-4 rounded-3xl shadow-lg mb-6 flex justify-between items-center border border-white/60 z-10 sticky top-4">
                        <div className="flex items-center gap-3">
                             <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-500">
                                <Icons.ArrowLeft size={24} />
                             </button>
                             <div>
                                <h2 className="font-bold text-slate-800 text-lg">สรุปเนื้อหาเตรียมสอบ</h2>
                                <p className="text-xs text-slate-500">ทบทวนความรู้ก่อนลงสนามจริง</p>
                             </div>
                        </div>
                    </div>

                    <div className="w-full max-w-3xl space-y-4 animate-fade-in-up pb-20">
                        {SUMMARIES.map((item) => (
                            <div key={item.id} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                <button 
                                    onClick={() => setOpenId(openId === item.id ? null : item.id)}
                                    className="w-full p-5 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors"
                                >
                                    <div className="flex items-center gap-4 text-left">
                                        <div className={`p-2.5 rounded-xl ${item.category === 'ภาค ก' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600'}`}>
                                            <Icons.FileText size={20} />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-slate-700 text-base md:text-lg">{item.title}</h3>
                                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${item.category === 'ภาค ก' ? 'bg-blue-50 text-blue-600' : 'bg-purple-50 text-purple-600'}`}>
                                                {item.category}
                                            </span>
                                        </div>
                                    </div>
                                    <div className={`text-slate-400 transition-transform duration-300 ${openId === item.id ? 'rotate-180' : ''}`}>
                                        <Icons.ChevronDown size={20} />
                                    </div>
                                </button>
                                
                                {openId === item.id && (
                                    <div className="p-5 pt-0 bg-white border-t border-slate-50 text-slate-600 text-sm leading-relaxed animate-slide-up">
                                        <div className="prose prose-sm max-w-none pt-4" dangerouslySetInnerHTML={{ __html: item.content }} />
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const AnalysisScreen = ({ onBack, userResultStats }) => {
            return (
                <div className="min-h-screen p-4 flex flex-col items-center pt-8 overflow-y-auto">
                    <div className="w-full max-w-3xl bg-white/90 backdrop-blur-xl p-4 rounded-3xl shadow-lg mb-6 flex justify-between items-center border border-white/60 z-10 sticky top-4">
                        <div className="flex items-center gap-3">
                             <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-500">
                                <Icons.ArrowLeft size={24} />
                             </button>
                             <div>
                                <h2 className="font-bold text-slate-800 text-lg">วิเคราะห์ผลการสอบ</h2>
                                <p className="text-xs text-slate-500">สถิติและพัฒนาการของคุณ</p>
                             </div>
                        </div>
                    </div>

                    <div className="w-full max-w-3xl space-y-6 animate-fade-in-up pb-20">
                        {/* Stats Overview */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center text-center">
                                <div className="p-3 bg-blue-100 text-blue-600 rounded-full mb-3"><Icons.Trophy size={24} /></div>
                                <h3 className="text-3xl font-bold text-slate-800">{userResultStats.totalExams}</h3>
                                <p className="text-xs text-slate-500">จำนวนชุดที่สอบ</p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center text-center">
                                <div className="p-3 bg-green-100 text-green-600 rounded-full mb-3"><Icons.TrendingUp size={24} /></div>
                                <h3 className="text-3xl font-bold text-slate-800">{userResultStats.avgScore}%</h3>
                                <p className="text-xs text-slate-500">คะแนนเฉลี่ยรวม</p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center text-center">
                                <div className="p-3 bg-purple-100 text-purple-600 rounded-full mb-3"><Icons.PieChart size={24} /></div>
                                <h3 className="text-3xl font-bold text-slate-800">{userResultStats.passRate}%</h3>
                                <p className="text-xs text-slate-500">อัตราการสอบผ่าน</p>
                            </div>
                        </div>

                        {/* Recent History */}
                        <div className="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden p-6">
                            <h3 className="font-bold text-lg text-slate-700 mb-4 flex items-center gap-2">
                                <Icons.Clock size={20} className="text-slate-400"/> ประวัติการสอบล่าสุด
                            </h3>
                            {userResultStats.history.length === 0 ? (
                                <div className="text-center text-slate-400 py-8 text-sm">ยังไม่มีประวัติการสอบ</div>
                            ) : (
                                <div className="space-y-3">
                                    {userResultStats.history.map((res, idx) => (
                                        <div key={idx} className="flex items-center justify-between p-4 bg-slate-50 rounded-xl hover:bg-slate-100 transition-colors">
                                            <div>
                                                <h4 className="font-bold text-slate-700 text-sm line-clamp-1">{res.fileName}</h4>
                                                <div className="flex gap-2 text-xs text-slate-500 mt-1">
                                                    <span>{new Date(res.timestamp).toLocaleDateString('th-TH')}</span>
                                                    <span>•</span>
                                                    <span className={res.part === 'A' ? 'text-blue-600' : 'text-purple-600'}>ภาค {res.part}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className={`font-bold text-lg ${res.percentage >= 60 ? 'text-green-600' : 'text-red-500'}`}>
                                                    {res.score}/{res.total}
                                                </div>
                                                <div className="text-[10px] text-slate-400">{res.percentage.toFixed(0)}%</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const SelectionScreen = ({ files, onSelectFile, onBack, partName }) => {
            return (
                <div className="min-h-screen p-4 flex flex-col items-center pt-8">
                     <div className="w-full max-w-3xl bg-white/90 backdrop-blur-xl p-4 rounded-3xl shadow-lg mb-6 flex justify-between items-center border border-white/60 z-10 sticky top-4">
                        <div className="flex items-center gap-3">
                             <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-500">
                                <Icons.ArrowLeft size={24} />
                             </button>
                             <div>
                                <h2 className="font-bold text-slate-800 text-lg">เลือกชุดข้อสอบ</h2>
                                <p className="text-xs text-slate-500">{partName}</p>
                             </div>
                        </div>
                    </div>

                    <div className="w-full max-w-2xl space-y-4 animate-fade-in-up">
                        {files.length === 0 ? (
                            <div className="text-center text-slate-500 py-10">ยังไม่มีไฟล์ข้อสอบในหมวดนี้</div>
                        ) : (
                            files.map((file) => (
                                <button 
                                    key={file.id}
                                    onClick={() => onSelectFile(file)}
                                    className="w-full bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-slate-100 hover:border-blue-200 transition-all group text-left flex items-center justify-between"
                                >
                                    <div className="flex items-center gap-4">
                                        <div className="bg-blue-50 text-blue-600 p-3 rounded-xl group-hover:scale-110 transition-transform">
                                            <Icons.List size={24} />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-slate-700 text-lg group-hover:text-blue-600 transition-colors line-clamp-1">{file.fileName}</h3>
                                            <p className="text-sm text-slate-400">อัพโหลดเมื่อ: {new Date(file.createdAt).toLocaleDateString('th-TH')} • {file.count} ข้อ</p>
                                        </div>
                                    </div>
                                    <Icons.ChevronRight className="text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all" />
                                </button>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const QuizScreen = ({ questions, finishQuiz, partName, goHome, fileName, isLoading }) => {
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [score, setScore] = useState(0);
            const [showExplanation, setShowExplanation] = useState(false);
            const [timeLeft, setTimeLeft] = useState(0); 
            
            useEffect(() => {
                if(questions.length > 0) {
                    setTimeLeft(60 * questions.length);
                    setCurrentQuestionIndex(0);
                    setSelectedOption(null);
                    setScore(0);
                    setShowExplanation(false);
                }
            }, [questions]);

            useEffect(() => {
                if(timeLeft <= 0) return;
                const timer = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            finishQuiz(score);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [score, finishQuiz, questions.length, timeLeft]);

            const handleOptionClick = (index) => {
                if (selectedOption !== null) return;
                setSelectedOption(index);
                if (index === questions[currentQuestionIndex].correctAnswer) setScore((prev) => prev + 1);
                setShowExplanation(true);
            };

            const nextQuestion = () => {
                const nextIndex = currentQuestionIndex + 1;
                if (nextIndex < questions.length) {
                    setCurrentQuestionIndex(nextIndex);
                    setSelectedOption(null);
                    setShowExplanation(false);
                } else {
                    finishQuiz(score);
                }
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };
            
            const handleGoHome = () => {
                if(confirm("ต้องการออกจากหน้าทำข้อสอบหรือไม่? ความคืบหน้าจะไม่ถูกบันทึก")) {
                    goHome();
                }
            };

            if (isLoading) return <div className="min-h-screen flex items-center justify-center text-slate-500"><Icons.Loader2 className="animate-spin mr-2"/> กำลังโหลดข้อสอบ...</div>;
            if (questions.length === 0) return <div className="min-h-screen flex items-center justify-center text-slate-500 font-bold text-xl">ไม่พบข้อสอบในไฟล์นี้</div>;
            
            const currentQ = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;

            return (
                <div className="min-h-screen p-3 md:p-4 flex flex-col items-center justify-start pt-4 md:pt-8 pb-8">
                    <div className="w-full max-w-3xl bg-white/90 backdrop-blur-xl p-3 md:p-4 rounded-2xl md:rounded-3xl shadow-lg mb-4 md:mb-8 flex justify-between items-center border border-white/50 z-10 sticky top-2 md:top-4">
                        <div className="flex flex-col">
                            <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">{partName}</span>
                            <div className="flex items-baseline gap-2">
                                <span className="text-slate-600 font-bold text-sm line-clamp-1 max-w-[150px] sm:max-w-xs">{fileName}</span>
                                <span className="text-xs text-slate-400 whitespace-nowrap">ข้อ {currentQuestionIndex + 1}/{questions.length}</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                             <div className={`flex items-center gap-1 md:gap-2 font-mono text-base md:text-xl font-bold px-3 py-1 md:px-4 rounded-xl ${timeLeft < 60 ? 'bg-red-50 text-red-500 animate-pulse border border-red-100' : 'bg-slate-50 text-slate-700 border border-slate-100'}`}>
                                <Icons.Clock size={16} className="md:w-5 md:h-5" />
                                {formatTime(timeLeft)}
                            </div>
                            <button onClick={handleGoHome} className="p-2 bg-slate-100 text-slate-500 rounded-xl hover:bg-red-50 hover:text-red-500 transition-colors" title="กลับหน้าหลัก">
                                <Icons.Home size={20} />
                            </button>
                        </div>
                    </div>

                    <div className="w-full max-w-3xl bg-white/95 backdrop-blur-xl p-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] shadow-2xl relative overflow-hidden z-10 border border-white/60 animate-fade-in-up">
                        <div className="absolute top-0 left-0 w-full h-1.5 md:h-2 bg-gray-100">
                            <div className="bg-gradient-to-r from-blue-500 to-indigo-600 h-full transition-all duration-700 ease-out" style={{ width: `${progress}%` }}></div>
                        </div>

                        <div className="mb-6 md:mb-8 mt-2 md:mt-4">
                            <span className="inline-block text-[10px] md:text-xs font-bold tracking-wider text-indigo-500 bg-indigo-50 px-2 py-1 md:px-3 rounded-lg uppercase mb-2 md:mb-4 border border-indigo-100">
                                {currentQ.category}
                            </span>
                            <h2 className="text-lg sm:text-xl md:text-3xl font-bold text-gray-800 leading-relaxed">
                                {currentQ.question}
                            </h2>
                        </div>

                        <div className="space-y-3 md:space-y-4">
                            {currentQ.options.map((option, idx) => {
                                let btnClass = "w-full text-left p-4 md:p-5 rounded-xl md:rounded-2xl border-2 transition-all duration-300 relative group text-base md:text-lg font-medium active:scale-[0.99] ";
                                if (selectedOption === null) {
                                    btnClass += "border-transparent bg-slate-50 hover:bg-white hover:border-blue-300 hover:shadow-lg hover:-translate-y-1 text-slate-600";
                                } else {
                                    if (idx === currentQ.correctAnswer) btnClass += "border-green-400 bg-green-50/50 text-green-800 shadow-md";
                                    else if (idx === selectedOption) btnClass += "border-red-400 bg-red-50/50 text-red-800";
                                    else btnClass += "border-transparent bg-slate-50 text-slate-300 opacity-60 grayscale";
                                }
                                return (
                                    <button key={idx} onClick={() => handleOptionClick(idx)} disabled={selectedOption !== null} className={btnClass}>
                                        <span className="flex items-center justify-between">
                                            <span>{idx + 1}. {option}</span>
                                            {selectedOption !== null && idx === currentQ.correctAnswer && <Icons.CheckCircle className="text-green-500" size={20} />}
                                            {selectedOption === idx && idx !== currentQ.correctAnswer && <Icons.XCircle className="text-red-500" size={20} />}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>

                        {showExplanation && (
                            <div className="mt-6 md:mt-8 overflow-hidden rounded-xl md:rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 animate-fade-in-up">
                                <div className="p-4 md:p-6">
                                    <h3 className="font-bold text-blue-800 mb-2 flex items-center gap-2 text-base md:text-lg">
                                        <Icons.Lightbulb size={20} className="text-yellow-500 md:w-6 md:h-6" /> คำอธิบาย
                                    </h3>
                                    <p className="text-slate-700 text-sm md:text-base leading-relaxed pl-7 md:pl-8">{currentQ.explanation}</p>
                                </div>
                                <div className="bg-blue-100/50 p-3 md:p-4 flex justify-end border-t border-blue-100">
                                    <button onClick={nextQuestion} className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white px-6 py-2 md:px-8 md:py-3 rounded-lg md:rounded-xl font-bold hover:shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2 shadow-blue-500/30 text-sm md:text-base">
                                        ข้อถัดไป <Icons.ArrowRight size={18} className="md:w-5 md:h-5" />
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ResultScreen = ({ score, total, restartQuiz, goHome, partName }) => {
            const percentage = total > 0 ? (score / total) * 100 : 0;
            const isPassed = percentage >= 60;
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white/95 backdrop-blur-2xl p-6 md:p-12 rounded-[2rem] md:rounded-[3rem] shadow-2xl max-w-lg w-full text-center relative overflow-hidden border border-white/60 animate-pop-in">
                        <div className={`absolute top-0 left-0 w-full h-1.5 md:h-2 bg-gradient-to-r ${isPassed ? 'from-green-400 to-emerald-500' : 'from-red-400 to-orange-500'}`}></div>
                        <div className="relative mb-4 md:mb-6">
                            <div className={`w-24 h-24 md:w-32 md:h-32 mx-auto rounded-full bg-gradient-to-br ${isPassed ? 'from-green-100 to-emerald-50 border-4 border-green-200' : 'from-red-100 to-orange-50 border-4 border-red-200'} shadow-xl flex items-center justify-center`}>
                                {isPassed ? <Icons.Trophy size={48} className="text-green-600 md:w-16 md:h-16" /> : <Icons.Frown size={48} className="text-red-500 md:w-16 md:h-16" />}
                            </div>
                        </div>
                        <span className="inline-block px-3 py-1 bg-slate-100 text-slate-500 rounded-full text-[10px] md:text-xs font-bold uppercase tracking-wider mb-2 md:mb-4 border border-slate-200">{partName}</span>
                        <h2 className={`text-2xl md:text-3xl font-extrabold mb-1 md:mb-2 ${isPassed ? 'text-green-700' : 'text-red-600'}`}>{isPassed ? "สอบผ่าน!" : "สอบไม่ผ่าน"}</h2>
                        <p className="text-slate-500 mb-6 md:mb-8 font-medium text-sm md:text-base">{isPassed ? "ยินดีด้วย คุณมีความพร้อมสำหรับการสอบจริง" : "ไม่ต้องเสียใจ ลองทบทวนเนื้อหาและสอบใหม่อีกครั้ง"}</p>
                        <div className="flex justify-center gap-3 md:gap-4 mb-8 md:mb-10">
                            <div className="bg-slate-50 p-3 md:p-5 rounded-2xl md:rounded-3xl border border-slate-100 w-24 md:w-32 shadow-sm">
                                <span className="block text-slate-400 text-[10px] md:text-xs font-bold mb-1">คะแนน</span>
                                <span className="block text-2xl md:text-4xl font-black text-slate-800">{score}</span>
                            </div>
                            <div className="bg-slate-50 p-3 md:p-5 rounded-2xl md:rounded-3xl border border-slate-100 w-24 md:w-32 shadow-sm">
                                <span className="block text-slate-400 text-[10px] md:text-xs font-bold mb-1">จากเต็ม</span>
                                <span className="block text-2xl md:text-4xl font-black text-slate-400">{total}</span>
                            </div>
                        </div>
                        <div className="space-y-3 relative z-10">
                            <button onClick={restartQuiz} className="w-full bg-slate-800 text-white font-bold py-3 md:py-4 rounded-xl md:rounded-2xl hover:bg-slate-900 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm md:text-base"><Icons.RotateCcw size={18} className="md:w-5 md:h-5" /> ทำข้อสอบใหม่อีกครั้ง</button>
                            <button onClick={goHome} className="w-full bg-white border-2 border-slate-200 text-slate-600 font-bold py-3 md:py-4 rounded-xl md:rounded-2xl hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm md:text-base"><Icons.Home size={18} className="md:w-5 md:h-5" /> กลับหน้าหลัก</button>
                        </div>
                    </div>
                </div>
            );
        };

        const EditModal = ({ question, onClose, onSave }) => {
            const [formData, setFormData] = useState(question);

            const handleChange = (field, value) => setFormData(prev => ({ ...prev, [field]: value }));
            const handleOptionChange = (idx, value) => {
                const newOptions = [...formData.options];
                newOptions[idx] = value;
                setFormData(prev => ({ ...prev, options: newOptions }));
            };

            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl animate-pop-in border border-slate-200">
                        <div className="sticky top-0 bg-white z-10 p-4 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="text-xl font-bold flex items-center gap-2 text-slate-700">
                                <div className="bg-blue-100 p-2 rounded-lg text-blue-600"><Icons.Edit size={20} /></div>
                                แก้ไขข้อสอบ
                            </h3>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icons.X size={20} /></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">ส่วน (Part)</label>
                                    <select value={formData.part} onChange={e => handleChange('part', e.target.value)} className="w-full p-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                                        <option value="A">ภาค ก</option>
                                        <option value="B">ภาค ข</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">หมวดหมู่</label>
                                    <input type="text" value={formData.category} onChange={e => handleChange('category', e.target.value)} className="w-full p-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">โจทย์คำถาม</label>
                                <textarea value={formData.question} onChange={e => handleChange('question', e.target.value)} rows="3" className="w-full p-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none resize-none"></textarea>
                            </div>
                            <div className="space-y-2">
                                <label className="block text-xs font-bold text-slate-500">ตัวเลือก</label>
                                {formData.options.map((opt, idx) => (
                                    <div key={idx} className="flex items-center gap-2">
                                        <span className="text-sm font-bold text-slate-400 w-6">{idx+1}.</span>
                                        <input type="text" value={opt} onChange={e => handleOptionChange(idx, e.target.value)} className="flex-1 p-2 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm" />
                                        <input type="radio" name="correct" checked={formData.correctAnswer === idx} onChange={() => handleChange('correctAnswer', idx)} className="w-4 h-4 text-green-500" />
                                    </div>
                                ))}
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">คำอธิบายเฉลย</label>
                                <textarea value={formData.explanation} onChange={e => handleChange('explanation', e.target.value)} rows="2" className="w-full p-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none resize-none bg-slate-50"></textarea>
                            </div>
                        </div>
                        <div className="p-4 border-t border-slate-100 flex justify-end gap-2 bg-slate-50 sticky bottom-0">
                            <button onClick={onClose} className="px-4 py-2 text-slate-500 font-bold hover:bg-slate-200 rounded-xl transition-colors">ยกเลิก</button>
                            <button onClick={() => onSave(formData)} className="px-6 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all active:scale-95">บันทึกการแก้ไข</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminScreen = ({ goBack, onAddFile, files, onDeleteFile, onUpdateQuestion, getQuestionsByFile, onDeleteQuestion }) => {
            // View Mode: 'files' (list of file sets) or 'questions' (list of questions in a file)
            const [viewMode, setViewMode] = useState('files'); 
            const [selectedFile, setSelectedFile] = useState(null);
            
            // For File List
            const [previewData, setPreviewData] = useState([]);
            const [errorMsg, setErrorMsg] = useState("");
            const [fileName, setFileName] = useState("");
            const [importPart, setImportPart] = useState('A'); 
            const [isSaving, setIsSaving] = useState(false);
            const fileInputRef = useRef(null);

            // For Question List (Detail View)
            const [questions, setQuestions] = useState([]);
            const [isLoadingQuestions, setIsLoadingQuestions] = useState(false);
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");

            // --- Handlers for File List ---
            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setFileName(file.name.replace('.csv', '')); // Default name from file
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = parseCSV(event.target.result);
                        if (parsed.length === 0) {
                            setErrorMsg("ไม่พบข้อมูล หรือรูปแบบไฟล์ไม่ถูกต้อง");
                            setPreviewData([]);
                        } else {
                            const parsedWithPart = parsed.map(item => Object.assign({}, item, { part: importPart }));
                            setPreviewData(parsedWithPart);
                            setErrorMsg("");
                        }
                    } catch (err) {
                        setErrorMsg("เกิดข้อผิดพลาดในการอ่านไฟล์");
                    }
                };
                reader.readAsText(file);
            };

            const handleSaveImport = async () => {
                if (previewData.length > 0 && fileName.trim()) {
                    setIsSaving(true);
                    await onAddFile(fileName, importPart, previewData);
                    setPreviewData([]);
                    setFileName("");
                    if(fileInputRef.current) fileInputRef.current.value = "";
                    setIsSaving(false);
                } else {
                    alert("กรุณาระบุชื่อไฟล์และเลือกไฟล์ CSV");
                }
            };

            const handleDeleteFile = async (file) => {
                if(confirm(`ต้องการลบไฟล์ "${file.fileName}" และข้อสอบทั้งหมดในไฟล์นี้ใช่หรือไม่?`)) {
                    await onDeleteFile(file.id);
                }
            };

            const handleManageFile = async (file) => {
                setSelectedFile(file);
                setViewMode('questions');
                setIsLoadingQuestions(true);
                const qs = await getQuestionsByFile(file.id);
                setQuestions(qs);
                setIsLoadingQuestions(false);
            };

            // --- Handlers for Question List ---
            const handleUpdateQ = async (updatedData) => {
                await onUpdateQuestion(updatedData.id, updatedData);
                setQuestions(prev => prev.map(q => q.id === updatedData.id ? updatedData : q));
                setEditingQuestion(null);
            };

            const handleDeleteQ = async (id) => {
                if(confirm('ต้องการลบข้อสอบข้อนี้ใช่หรือไม่?')) {
                    await onDeleteQuestion(id);
                    setQuestions(prev => prev.filter(q => q.id !== id));
                }
            }

            // --- Render Logic ---

            if (viewMode === 'questions') {
                const filteredQuestions = questions.filter(q => 
                    q.question.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    q.category.toLowerCase().includes(searchTerm.toLowerCase())
                );

                return (
                    <div className="min-h-screen p-4 overflow-y-auto pb-20">
                        <div className="max-w-6xl mx-auto space-y-6">
                            <div className="bg-white/90 backdrop-blur-xl rounded-[2rem] p-6 shadow-xl border border-white/60 flex items-center justify-between gap-4 sticky top-4 z-20">
                                <div>
                                    <div className="text-xs text-slate-500 font-bold uppercase mb-1">กำลังแก้ไขไฟล์</div>
                                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                        <Icons.FileText className="text-blue-600"/> {selectedFile && selectedFile.fileName}
                                    </h2>
                                </div>
                                <button onClick={() => setViewMode('files')} className="bg-slate-100 text-slate-600 hover:bg-slate-200 px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 font-bold text-sm">
                                    <Icons.ArrowLeft size={18} /> กลับไปหน้ารายชื่อไฟล์
                                </button>
                            </div>

                            <div className="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col min-h-[500px]">
                                <div className="p-6 border-b border-slate-100 flex justify-between items-center gap-4 bg-slate-50/50">
                                    <div className="font-bold text-slate-700">รายการข้อสอบ ({questions.length})</div>
                                    <div className="relative w-full sm:w-64">
                                        <Icons.Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input type="text" placeholder="ค้นหาโจทย์..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-400 text-sm"/>
                                    </div>
                                </div>
                                <div className="overflow-x-auto flex-1">
                                    {isLoadingQuestions ? (
                                        <div className="p-10 text-center text-slate-500 flex justify-center"><Icons.Loader2 className="animate-spin"/></div>
                                    ) : (
                                        <table className="w-full text-left text-slate-600">
                                            <thead className="bg-slate-50 text-xs uppercase font-bold text-slate-500 sticky top-0">
                                                <tr><th className="px-6 py-4">ข้อที่</th><th className="px-6 py-4">โจทย์</th><th className="px-6 py-4 text-right">จัดการ</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {filteredQuestions.map((q, idx) => (
                                                    <tr key={q.id} className="hover:bg-blue-50/30">
                                                        <td className="px-6 py-4 font-mono text-slate-400">{idx + 1}</td>
                                                        <td className="px-6 py-4 max-w-lg">
                                                            <div className="line-clamp-2 font-medium text-slate-800">{q.question}</div>
                                                            <div className="text-xs text-slate-400 mt-1">{q.category}</div>
                                                        </td>
                                                        <td className="px-6 py-4 text-right space-x-2">
                                                            <button onClick={() => setEditingQuestion(q)} className="text-blue-600 hover:bg-blue-50 p-2 rounded-lg"><Icons.Edit size={16}/></button>
                                                            <button onClick={() => handleDeleteQ(q.id)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg"><Icons.Trash2 size={16}/></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </div>
                        {editingQuestion && <EditModal question={editingQuestion} onClose={() => setEditingQuestion(null)} onSave={handleUpdateQ} />}
                    </div>
                );
            }

            // Default View: File List
            return (
                <div className="min-h-screen p-4 overflow-y-auto pb-20">
                    <div className="max-w-6xl mx-auto space-y-6">
                        <div className="bg-white/90 backdrop-blur-xl rounded-[2rem] p-6 shadow-xl border border-white/60 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-3">
                                <div className="bg-blue-100 p-2.5 rounded-xl text-blue-600 shadow-sm"><Icons.Settings size={28} /></div>
                                ระบบจัดการไฟล์ข้อสอบ
                            </h2>
                            <button onClick={goBack} className="bg-white border-2 border-slate-100 text-slate-600 hover:text-slate-900 hover:border-slate-300 px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 font-bold text-sm shadow-sm hover:shadow active:scale-95">
                                <Icons.ArrowLeft size={18} /> กลับหน้าหลัก
                            </button>
                        </div>

                        {/* Import Section */}
                        <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-xl border border-slate-100 relative">
                            <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-slate-700">
                                <div className="bg-indigo-100 p-1.5 rounded-lg text-indigo-600"><Icons.UploadCloud size={20} /></div>
                                นำเข้าไฟล์ข้อสอบใหม่ (CSV)
                            </h3>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">ชื่อไฟล์/ชุดข้อสอบ:</label>
                                    <input type="text" value={fileName} onChange={e => setFileName(e.target.value)} placeholder="เช่น กฎหมายท้องถิ่น ชุดที่ 1" className="w-full p-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 bg-slate-50 text-sm"/>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-2">หมวดวิชา:</label>
                                    <div className="flex gap-4">
                                        <label className={`flex-1 flex items-center justify-center gap-2 cursor-pointer p-3 rounded-xl border transition-all ${importPart === 'A' ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                            <input type="radio" name="importPart" value="A" checked={importPart === 'A'} onChange={(e) => setImportPart(e.target.value)} className="hidden" />
                                            <span className="text-sm font-bold">ภาค ก</span>
                                        </label>
                                        <label className={`flex-1 flex items-center justify-center gap-2 cursor-pointer p-3 rounded-xl border transition-all ${importPart === 'B' ? 'bg-purple-50 border-purple-500 text-purple-700' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}>
                                            <input type="radio" name="importPart" value="B" checked={importPart === 'B'} onChange={(e) => setImportPart(e.target.value)} className="hidden" />
                                            <span className="text-sm font-bold">ภาค ข</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row gap-4 mb-4">
                                <div className="relative flex-1 group">
                                    <input type="file" accept=".csv" onChange={handleFileChange} ref={fileInputRef} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:border-blue-400 transition-colors py-2 px-3"/>
                                </div>
                                {files.length === 0 && <button onClick={onSeedData} className="px-4 py-2 bg-amber-50 text-amber-600 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-amber-100 transition-colors border border-amber-200"><Icons.RefreshCw size={16} /> โหลดตัวอย่าง</button>}
                            </div>

                            {previewData.length > 0 && (
                                <div className="animate-fade-in-up bg-green-50 p-4 rounded-2xl border border-green-100 flex justify-between items-center">
                                    <div className="text-green-800 text-sm font-bold flex items-center gap-2"><Icons.CheckCircle size={18} /> พร้อมนำเข้า {previewData.length} ข้อ</div>
                                    <button onClick={handleSaveImport} disabled={isSaving} className="bg-green-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-green-700 shadow-lg shadow-green-500/20 flex items-center gap-2 active:scale-95 text-sm transition-all">{isSaving ? <Icons.Loader2 size={16} className="animate-spin" /> : <Icons.Save size={16} />} ยืนยันการสร้างไฟล์</button>
                                </div>
                            )}
                            {errorMsg && <div className="bg-red-50 text-red-600 p-3 rounded-xl mt-2 border border-red-100 flex items-center gap-2 text-sm animate-shake"><Icons.AlertCircle size={18} /> {errorMsg}</div>}
                        </div>

                        {/* File List Table */}
                        <div className="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col min-h-[400px]">
                            <div className="p-6 border-b border-slate-100 bg-slate-50/50">
                                <h3 className="font-bold text-lg text-slate-700 flex items-center gap-2">
                                    <div className="bg-orange-100 p-1.5 rounded-lg text-orange-600"><Icons.List size={20} /></div>
                                    รายการไฟล์ข้อสอบที่มีในระบบ
                                </h3>
                            </div>
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full text-left text-slate-600">
                                    <thead className="bg-slate-50 text-xs uppercase font-bold text-slate-500">
                                        <tr><th className="px-6 py-4">ชื่อชุดข้อสอบ</th><th className="px-6 py-4">หมวด</th><th className="px-6 py-4">จำนวนข้อ</th><th className="px-6 py-4">วันที่สร้าง</th><th className="px-6 py-4 text-right">จัดการ</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {files.length === 0 ? (
                                            <tr><td colSpan="5" className="text-center py-10 text-slate-400">ยังไม่มีไฟล์ข้อสอบ</td></tr>
                                        ) : (
                                            files.map((f) => (
                                                <tr key={f.id} className="hover:bg-blue-50/30">
                                                    <td className="px-6 py-4 font-bold text-slate-700">{f.fileName}</td>
                                                    <td className="px-6 py-4"><span className={`px-2 py-1 rounded text-[10px] font-bold ${f.part === 'A' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>ภาค {f.part}</span></td>
                                                    <td className="px-6 py-4">{f.count} ข้อ</td>
                                                    <td className="px-6 py-4 text-slate-400 text-xs">{new Date(f.createdAt).toLocaleDateString('th-TH')}</td>
                                                    <td className="px-6 py-4 text-right space-x-2">
                                                        <button onClick={() => handleManageFile(f)} className="text-blue-600 hover:bg-blue-50 p-2 rounded-lg font-bold text-xs border border-blue-200">แก้ไขข้อสอบ</button>
                                                        <button onClick={() => handleDeleteFile(f)} className="text-red-500 hover:bg-red-50 p-2 rounded-lg"><Icons.Trash2 size={16}/></button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [isReady, setIsReady] = useState(false);
            const [gameState, setGameState] = useState('welcome'); 
            const [score, setScore] = useState(0);
            
            const [files, setFiles] = useState([]);
            const [activeQuestions, setActiveQuestions] = useState([]); 
            
            const [selectedPart, setSelectedPart] = useState(null); 
            const [selectedFile, setSelectedFile] = useState(null); 

            const [userResultStats, setUserResultStats] = useState({ totalExams: 0, avgScore: 0, passRate: 0, history: [] });

            const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            
            // Initial Check for Firebase
            useEffect(() => {
                if (window.FB) {
                    setIsReady(true);
                } else {
                    window.addEventListener('firebase-ready', () => setIsReady(true));
                }
            }, []);

            useEffect(() => {
                if (!isReady) return;
                
                const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FB;

                const initAuth = async () => {
                    try {
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        setAuthError(error.message);
                        setIsLoading(false);
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) setAuthError(null);
                });
                return () => unsubscribe();
            }, [isReady]);

            // Fetch Files
            useEffect(() => {
                if (!user || !isReady) return;
                const { db, collection, query, onSnapshot, orderBy, appId } = window.FB;
                
                const filesPath = collection(db, 'artifacts', appId, 'public', 'data', 'files');
                const filesQuery = query(filesPath, orderBy('createdAt', 'desc'));
                
                const unsubscribe = onSnapshot(filesQuery, (snapshot) => {
                    const loadedFiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setFiles(loadedFiles);
                    setIsLoading(false);
                }, (error) => {
                    setAuthError("เชื่อมต่อฐานข้อมูลไม่ได้ (Files)");
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [user, isReady]);

            // Fetch User Results
            useEffect(() => {
                if (!user || !isReady) return;
                const { db, collection, query, onSnapshot, orderBy, appId } = window.FB;

                const resultsPath = collection(db, 'artifacts', appId, 'users', user.uid, 'results');
                const resultsQuery = query(resultsPath, orderBy('timestamp', 'desc'));

                const unsubscribe = onSnapshot(resultsQuery, (snapshot) => {
                    const history = snapshot.docs.map(doc => doc.data());
                    if (history.length > 0) {
                        const totalExams = history.length;
                        const totalScorePercentage = history.reduce((sum, res) => sum + res.percentage, 0);
                        const avgScore = (totalScorePercentage / totalExams).toFixed(1);
                        const passedCount = history.filter(res => res.percentage >= 60).length;
                        const passRate = ((passedCount / totalExams) * 100).toFixed(1);
                        setUserResultStats({ totalExams, avgScore, passRate, history });
                    } else {
                        setUserResultStats({ totalExams: 0, avgScore: 0, passRate: 0, history: [] });
                    }
                });
                return () => unsubscribe();
            }, [user, isReady]);

            // Handlers
            const handleSelectPart = (part) => {
                setSelectedPart(part);
                setGameState('selection');
            };

            const handleSelectFileForQuiz = async (file) => {
                if (!isReady) return;
                const { db, collection, query, where, getDocs, appId } = window.FB;
                setSelectedFile(file);
                setIsLoading(true);
                try {
                    const qCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                    const qQuery = query(qCol, where('fileId', '==', file.id));
                    const snapshot = await getDocs(qQuery);
                    const loadedQuestions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setActiveQuestions(loadedQuestions);
                    setScore(0);
                    setGameState('quiz');
                } catch (e) {
                    alert("เกิดข้อผิดพลาดในการโหลดข้อสอบ");
                } finally {
                    setIsLoading(false);
                }
            };

            const handleFinishQuiz = async (finalScore) => {
                setScore(finalScore);
                setGameState('result');
                if (user && selectedFile && isReady) {
                    const { db, collection, addDoc, appId } = window.FB;
                    try {
                        const resultsCol = collection(db, 'artifacts', appId, 'users', user.uid, 'results');
                        await addDoc(resultsCol, {
                            fileId: selectedFile.id,
                            fileName: selectedFile.fileName,
                            part: selectedPart,
                            score: finalScore,
                            total: activeQuestions.length,
                            percentage: (finalScore / activeQuestions.length) * 100,
                            timestamp: Date.now()
                        });
                    } catch (e) {
                        console.error("Error saving result:", e);
                    }
                }
            };

            // Admin Functions
            const addFileAndQuestions = async (fileName, part, newQuestions) => {
                if (!user || !isReady) return;
                const { db, collection, addDoc, writeBatch, doc, appId } = window.FB;
                try {
                    const filesCol = collection(db, 'artifacts', appId, 'public', 'data', 'files');
                    const fileRef = await addDoc(filesCol, {
                        fileName,
                        part,
                        count: newQuestions.length,
                        createdAt: Date.now()
                    });

                    const questionsCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                    const batch = writeBatch(db);
                    
                    newQuestions.forEach((q) => {
                        const newDocRef = doc(questionsCol);
                        batch.set(newDocRef, Object.assign({}, q, { fileId: fileRef.id }));
                    });

                    await batch.commit();
                    alert(`บันทึกไฟล์ "${fileName}" เรียบร้อยแล้ว (${newQuestions.length} ข้อ)`);
                } catch (error) {
                    alert("เกิดข้อผิดพลาดในการบันทึก: " + error.message);
                }
            };

            const deleteFileAndQuestions = async (fileId) => {
                if (!user || !isReady) return;
                const { db, doc, deleteDoc, collection, query, where, getDocs, writeBatch, appId } = window.FB;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'files', fileId));
                    
                    const qCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                    const qQuery = query(qCol, where('fileId', '==', fileId));
                    const snapshot = await getDocs(qQuery);
                    
                    const batch = writeBatch(db);
                    snapshot.forEach(doc => batch.delete(doc.ref));
                    await batch.commit();
                    
                    alert("ลบไฟล์และข้อสอบทั้งหมดเรียบร้อยแล้ว");
                } catch (e) {
                    alert("ลบไม่สำเร็จ: " + e.message);
                }
            };
            
            const getQuestionsByFile = async (fileId) => {
                 if (!user || !isReady) return [];
                 const { db, collection, query, where, getDocs, appId } = window.FB;
                 const qCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                 const qQuery = query(qCol, where('fileId', '==', fileId));
                 const snapshot = await getDocs(qQuery);
                 return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            };

            const updateQuestion = async (id, newData) => {
                if (!user || !isReady) return;
                const { db, doc, updateDoc, appId } = window.FB;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', id), newData);
                } catch (e) {
                    alert("แก้ไขไม่สำเร็จ: " + e.message);
                }
            };

            const deleteQuestion = async (id) => {
                if (!user || !isReady) return;
                const { db, doc, deleteDoc, appId } = window.FB;
                 try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', id));
                } catch (e) {
                    alert("ลบไม่สำเร็จ: " + e.message);
                }
            };

            const handleSeedData = async () => {
                if(confirm("โหลดข้อมูลตัวอย่าง?")) await addFileAndQuestions("แนวข้อสอบตัวอย่าง ชุดที่ 1", "A", INITIAL_QUESTIONS);
            };

            const fileStats = { 
                A: files.filter(f => f.part === 'A').length, 
                B: files.filter(f => f.part === 'B').length 
            };
            
            const getPartName = (part) => part === 'A' ? "ภาค ก (ความรู้ทั่วไป)" : "ภาค ข (ความรู้เฉพาะตำแหน่ง)";

            if (!isReady) return <div className="flex items-center justify-center min-h-screen text-slate-500"><Icons.Loader2 className="animate-spin mr-2" /> กำลังโหลดระบบ...</div>;

            return (
                <div>
                    <div className="fixed inset-0 bg-slate-50 -z-20"></div>
                    <div className="fixed inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-200/40 via-purple-200/40 to-transparent -z-10 animate-pulse-slow"></div>
                    <div className="fixed inset-0 bg-[radial-gradient(ellipse_at_bottom_left,_var(--tw-gradient-stops))] from-indigo-200/40 via-cyan-200/40 to-transparent -z-10 animate-pulse-slow delay-1000"></div>

                    {gameState === 'welcome' && (
                        <WelcomeScreen 
                            onSelectPart={handleSelectPart} 
                            goToAdmin={() => setGameState('admin')} 
                            goToSummary={() => setGameState('summary')}
                            goToAnalysis={() => setGameState('analysis')}
                            fileStats={fileStats} 
                            isLoading={isLoading} 
                            authError={authError} 
                        />
                    )}
                    {gameState === 'summary' && <SummaryScreen onBack={() => setGameState('welcome')} />}
                    {gameState === 'analysis' && <AnalysisScreen onBack={() => setGameState('welcome')} userResultStats={userResultStats} />}
                    {gameState === 'selection' && <SelectionScreen files={files.filter(f => f.part === selectedPart)} onSelectFile={handleSelectFileForQuiz} onBack={() => setGameState('welcome')} partName={getPartName(selectedPart)} />}
                    {gameState === 'quiz' && <QuizScreen questions={activeQuestions} finishQuiz={handleFinishQuiz} partName={getPartName(selectedPart)} fileName={selectedFile ? selectedFile.fileName : ''} goHome={() => setGameState('welcome')} isLoading={isLoading} />}
                    {gameState === 'result' && <ResultScreen score={score} total={activeQuestions.length} restartQuiz={() => { setScore(0); setGameState('quiz'); }} goHome={() => { setGameState('welcome'); setSelectedPart(null); setSelectedFile(null); }} partName={getPartName(selectedPart)} />}
                    {gameState === 'admin' && (
                        <AdminScreen 
                            goBack={() => setGameState('welcome')} 
                            onAddFile={addFileAndQuestions} 
                            files={files}
                            onSeedData={handleSeedData} 
                            onDeleteFile={deleteFileAndQuestions}
                            onUpdateQuestion={updateQuestion}
                            onDeleteQuestion={deleteQuestion}
                            getQuestionsByFile={getQuestionsByFile}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
