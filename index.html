<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คลังข้อสอบราชการ (Direct Web)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Sarabun', sans-serif; }
        
        /* Custom Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes pulseSlow { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.8; } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pop-in { animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pulse-slow { animation: pulseSlow 8s ease-in-out infinite; }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        .animate-fade-in-up { animation: slideUp 0.4s ease-out forwards; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">
    <div id="root"></div>

    <!-- Firebase Setup (Module Script) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getAuth, 
            signInAnonymously, 
            onAuthStateChanged,
            signInWithCustomToken 
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            query,
            doc,
            getDoc,
            deleteDoc,
            updateDoc
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Config fallback logic
        let firebaseConfig;
        let appId;
        
        try {
            if (typeof window.__firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(window.__firebase_config);
                appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'default-app-id';
            } else {
                // ==========================================
                //  ส่วนแก้ไขค่า Config สำหรับรันบนเครื่องตัวเอง (Local)
                // ==========================================
                firebaseConfig = {
                    apiKey: "AIzaSyAa1BBpDBC88rmmrxoQ1FzaevgXjlbOZJ8", 
                    authDomain: "local-68-68d5c.firebaseapp.com",    
                    projectId: "local-68-68d5c",                      
                    storageBucket: "local-68-68d5c.firebasestorage.app",
                    messagingSenderId: "478841571906",
                    appId: "1:478841571906:web:6cc77709f37b1b0274fbdb"
                };
                appId = 'local-exam-app-v1';
            }
        } catch (e) {
            console.warn("Config error, using default");
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Expose Firebase to Window for React Component
        window.FB = {
            auth,
            db,
            appId,
            signInAnonymously,
            signInWithCustomToken,
            onAuthStateChanged,
            collection,
            addDoc,
            deleteDoc,
            updateDoc,
            doc,
            onSnapshot,
            query
        };
        
        // Signal that Firebase is ready
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <!-- React Application -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const QUESTIONS_PER_SET = 20; // กำหนดจำนวนข้อต่อชุด

        // --- Icon Components ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Icons = {
            BookOpen: (p) => <IconBase {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></IconBase>,
            Info: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></IconBase>,
            ArrowRight: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>,
            Clock: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>,
            CheckCircle: (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>,
            XCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></IconBase>,
            Lightbulb: (p) => <IconBase {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.4 1.5-3.8 0-3.2-2.8-5-6-5.6-2.6-.5-5.3 1.1-6 3.6-.5 1.7 0 3.5 1.3 4.8.8.8 1.2 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconBase>,
            Trophy: (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2h-6c-2 0-3 1-3 3v4c0 3 2 5 5 6h.5c3 0 5-2 5-6V5c0-2-1-3-3-3z"/></IconBase>,
            Frown: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></IconBase>,
            RotateCcw: (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>,
            Home: (p) => <IconBase {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></IconBase>,
            Settings: (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            ArrowLeft: (p) => <IconBase {...p}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></IconBase>,
            UploadCloud: (p) => <IconBase {...p}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></IconBase>,
            Save: (p) => <IconBase {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>,
            Database: (p) => <IconBase {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s 9-1.34 9-3V5"/></IconBase>,
            AlertCircle: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>,
            Briefcase: (p) => <IconBase {...p}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></IconBase>,
            GraduationCap: (p) => <IconBase {...p}><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></IconBase>,
            Star: (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>,
            ChevronRight: (p) => <IconBase {...p}><path d="m9 18 6-6-6-6"/></IconBase>,
            Loader2: (p) => <IconBase {...p} className={`${p.className} animate-spin`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></IconBase>,
            RefreshCw: (p) => <IconBase {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>,
            Trash2: (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>,
            Edit: (p) => <IconBase {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></IconBase>,
            Search: (p) => <IconBase {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></IconBase>,
            X: (p) => <IconBase {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>,
            List: (p) => <IconBase {...p}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></IconBase>
        };

        // --- Mock Data ---
        const INITIAL_QUESTIONS = [
            { part: 'A', category: "ความสามารถทั่วไป", question: "จงหาตัวเลขถัดไป: 2, 5, 10, ...", options: ["17", "20", "25", "26"], correctAnswer: 0, explanation: "เพิ่มทีละเลขคี่ 3, 5, 7", createdAt: Date.now() },
            { part: 'A', category: "ภาษาไทย", question: "ข้อใดสะกดถูก?", options: ["อนุญาติ", "อนุญาต", "กฏหมาย", "ศรีษะ"], correctAnswer: 1, explanation: "อนุญาต ไม่มีสระอิ", createdAt: Date.now() + 1 },
            { part: 'B', category: "ระเบียบ", question: "หนังสือภายใน ใช้กระดาษอะไร?", options: ["ตราครุฑ", "บันทึกข้อความ", "อาร์ตมัน", "A4 เปล่า"], correctAnswer: 1, explanation: "หนังสือภายในใช้กระดาษบันทึกข้อความ", createdAt: Date.now() + 2 }
        ];

        // --- Helper: CSV Parser ---
        const parseCSV = (text) => {
            const lines = text.split('\n');
            const result = [];
            const startRow = lines[0].toLowerCase().includes('question') ? 1 : 0;
            for (let i = startRow; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                const clean = (str) => str ? str.replace(/^"|"$/g, '').trim() : "";
                if (parts.length >= 7) {
                    result.push({
                        part: parts.length >= 9 ? clean(parts[0]).toUpperCase() : 'A', 
                        category: parts.length >= 9 ? clean(parts[1]) : 'ทั่วไป', 
                        question: clean(parts.length >= 9 ? parts[2] : parts[0]),
                        options: [
                            clean(parts.length >= 9 ? parts[3] : parts[1]), 
                            clean(parts.length >= 9 ? parts[4] : parts[2]), 
                            clean(parts.length >= 9 ? parts[5] : parts[3]), 
                            clean(parts.length >= 9 ? parts[6] : parts[4])
                        ],
                        correctAnswer: parseInt(clean(parts.length >= 9 ? parts[7] : parts[5])) - 1, 
                        explanation: clean(parts.length >= 9 ? parts[8] : parts[6]),
                        createdAt: Date.now() + i
                    });
                }
            }
            return result;
        };

        // --- Components ---

        const WelcomeScreen = ({ onSelectPart, goToAdmin, questionCounts, isLoading, authError }) => (
            <div className="flex flex-col items-center justify-center min-h-screen p-4 md:p-6 text-center relative overflow-hidden">
                <button 
                    onClick={goToAdmin}
                    className="absolute top-4 right-4 md:top-6 md:right-6 p-2 md:p-3 bg-white/50 backdrop-blur-md text-slate-600 hover:bg-white/80 rounded-full transition-all shadow-lg border border-white/40 z-20 active:scale-95"
                    title="เข้าสู่ระบบจัดการข้อสอบ"
                >
                    <Icons.Settings size={20} className="md:w-6 md:h-6" />
                </button>

                <div className="max-w-5xl w-full z-10 flex flex-col justify-center min-h-[80vh]">
                    <div className="mb-8 md:mb-12 animate-slide-up">
                        <div className="inline-flex items-center justify-center p-4 md:p-6 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl shadow-xl mb-4 md:mb-6 ring-4 ring-blue-100">
                            <Icons.BookOpen className="text-white drop-shadow-md w-12 h-12 md:w-16 md:h-16" />
                        </div>
                        <h1 className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600 mb-2 md:mb-4 tracking-tight drop-shadow-sm">
                            คลังข้อสอบราชการ
                        </h1>
                        <p className="text-slate-600 text-base sm:text-lg md:text-xl font-light tracking-wide max-w-2xl mx-auto px-4">
                            แพลตฟอร์มจำลองสนามสอบเสมือนจริง<br className="hidden sm:block"/> เตรียมความพร้อมสู่ความสำเร็จ
                        </p>
                    </div>

                    {isLoading ? (
                        <div className="flex flex-col items-center justify-center h-48 md:h-64 text-slate-500 animate-pulse">
                            <Icons.Loader2 size={40} className="animate-spin mb-4 text-blue-500 md:w-12 md:h-12" />
                            <p className="text-sm md:text-base">กำลังเชื่อมต่อฐานข้อมูล...</p>
                        </div>
                    ) : authError ? (
                        <div className="mx-4 flex flex-col items-center justify-center text-red-500 bg-red-50 rounded-3xl p-6 border border-red-200 shadow-sm max-w-2xl mx-auto">
                            <Icons.AlertCircle size={40} className="mb-3 md:w-12 md:h-12" />
                            <h3 className="text-base md:text-lg font-bold">เกิดข้อผิดพลาดในการเชื่อมต่อ</h3>
                            <p className="text-xs md:text-sm mb-2 font-mono bg-red-100/50 p-2 rounded">{authError}</p>
                            <p className="text-xs text-slate-500 mt-2">โปรดตรวจสอบการตั้งค่า Firebase</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 max-w-3xl mx-auto w-full px-2 sm:px-4">
                            <button 
                                onClick={() => onSelectPart('A')}
                                className="group relative bg-white/80 backdrop-blur-xl p-6 md:p-8 rounded-[1.5rem] md:rounded-[2rem] shadow-lg hover:shadow-2xl hover:shadow-blue-500/20 transition-all duration-300 transform active:scale-[0.98] md:hover:-translate-y-2 text-left border border-white/50 overflow-hidden"
                            >
                                <div className="absolute top-0 right-0 w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-blue-400/20 to-purple-400/20 rounded-bl-[3rem] md:rounded-bl-[4rem] -mr-6 -mt-6 transition-all group-hover:scale-110"></div>
                                <div className="relative z-10">
                                    <div className="flex items-start justify-between mb-4 md:mb-6">
                                        <div className="p-3 md:p-4 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl md:rounded-2xl shadow-lg text-white group-hover:scale-110 transition-transform duration-300">
                                            <Icons.GraduationCap size={24} className="md:w-8 md:h-8" />
                                        </div>
                                        <div className="flex items-center gap-1 bg-blue-50 text-blue-700 px-2 py-1 md:px-3 rounded-full text-xs font-bold shadow-inner">
                                            <Icons.Star size={10} className="fill-current md:w-3 md:h-3" /> {questionCounts.A || 0} ข้อ
                                        </div>
                                    </div>
                                    <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-1 md:mb-2 group-hover:text-blue-700 transition-colors">ภาค ก</h2>
                                    <p className="text-gray-500 text-xs md:text-sm mb-4 md:mb-6 line-clamp-1">ความรู้ความสามารถทั่วไป (คณิต, ไทย, อังกฤษ)</p>
                                    <div className="flex items-center text-blue-600 font-semibold text-sm md:text-base group-hover:translate-x-2 transition-transform">
                                        เลือกชุดข้อสอบ <Icons.ChevronRight size={16} className="md:w-5 md:h-5 ml-1" />
                                    </div>
                                </div>
                            </button>

                            <button 
                                onClick={() => onSelectPart('B')}
                                className="group relative bg-white/80 backdrop-blur-xl p-6 md:p-8 rounded-[1.5rem] md:rounded-[2rem] shadow-lg hover:shadow-2xl hover:shadow-purple-500/20 transition-all duration-300 transform active:scale-[0.98] md:hover:-translate-y-2 text-left border border-white/50 overflow-hidden"
                            >
                                <div className="absolute top-0 right-0 w-24 h-24 md:w-32 md:h-32 bg-gradient-to-br from-purple-400/20 to-pink-400/20 rounded-bl-[3rem] md:rounded-bl-[4rem] -mr-6 -mt-6 transition-all group-hover:scale-110"></div>
                                <div className="relative z-10">
                                    <div className="flex items-start justify-between mb-4 md:mb-6">
                                        <div className="p-3 md:p-4 bg-gradient-to-br from-purple-500 to-fuchsia-600 rounded-xl md:rounded-2xl shadow-lg text-white group-hover:scale-110 transition-transform duration-300">
                                            <Icons.Briefcase size={24} className="md:w-8 md:h-8" />
                                        </div>
                                        <div className="flex items-center gap-1 bg-purple-50 text-purple-700 px-2 py-1 md:px-3 rounded-full text-xs font-bold shadow-inner">
                                            <Icons.Star size={10} className="fill-current md:w-3 md:h-3" /> {questionCounts.B || 0} ข้อ
                                        </div>
                                    </div>
                                    <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-1 md:mb-2 group-hover:text-purple-700 transition-colors">ภาค ข</h2>
                                    <p className="text-gray-500 text-xs md:text-sm mb-4 md:mb-6 line-clamp-1">ความรู้ความสามารถเฉพาะตำแหน่ง (กฎหมาย)</p>
                                    <div className="flex items-center text-purple-600 font-semibold text-sm md:text-base group-hover:translate-x-2 transition-transform">
                                        เลือกชุดข้อสอบ <Icons.ChevronRight size={16} className="md:w-5 md:h-5 ml-1" />
                                    </div>
                                </div>
                            </button>
                        </div>
                    )}

                    <div className="mt-8 md:mt-16 text-slate-500 text-xs md:text-sm flex items-center justify-center gap-2 font-medium pb-4">
                        <Icons.Info size={14} className="md:w-4 md:h-4" />
                        <span>เกณฑ์การผ่าน 60% ในแต่ละชุดวิชา</span>
                    </div>
                </div>
            </div>
        );

        const SelectionScreen = ({ questions, onSelectSet, onBack, partName }) => {
            const totalSets = Math.ceil(questions.length / QUESTIONS_PER_SET);
            const sets = Array.from({ length: totalSets }, (_, i) => ({
                id: i + 1,
                start: i * QUESTIONS_PER_SET,
                count: Math.min(QUESTIONS_PER_SET, questions.length - i * QUESTIONS_PER_SET)
            }));

            return (
                <div className="min-h-screen p-4 flex flex-col items-center pt-8">
                     <div className="w-full max-w-3xl bg-white/90 backdrop-blur-xl p-4 rounded-3xl shadow-lg mb-6 flex justify-between items-center border border-white/60 z-10 sticky top-4">
                        <div className="flex items-center gap-3">
                             <button onClick={onBack} className="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-500">
                                <Icons.ArrowLeft size={24} />
                             </button>
                             <div>
                                <h2 className="font-bold text-slate-800 text-lg">เลือกชุดข้อสอบ</h2>
                                <p className="text-xs text-slate-500">{partName}</p>
                             </div>
                        </div>
                    </div>

                    <div className="w-full max-w-2xl space-y-4 animate-fade-in-up">
                        {sets.length === 0 ? (
                            <div className="text-center text-slate-500 py-10">ไม่มีข้อสอบในหมวดนี้</div>
                        ) : (
                            sets.map((set) => (
                                <button 
                                    key={set.id}
                                    onClick={() => onSelectSet(set.id - 1)}
                                    className="w-full bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-slate-100 hover:border-blue-200 transition-all group text-left flex items-center justify-between"
                                >
                                    <div className="flex items-center gap-4">
                                        <div className="bg-blue-50 text-blue-600 p-3 rounded-xl group-hover:scale-110 transition-transform">
                                            <Icons.List size={24} />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-slate-700 text-lg group-hover:text-blue-600 transition-colors">ชุดข้อสอบที่ {set.id}</h3>
                                            <p className="text-sm text-slate-400">จำนวน {set.count} ข้อ</p>
                                        </div>
                                    </div>
                                    <Icons.ChevronRight className="text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all" />
                                </button>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        const QuizScreen = ({ questions, finishQuiz, partName, goHome }) => {
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [score, setScore] = useState(0);
            const [showExplanation, setShowExplanation] = useState(false);
            const [timeLeft, setTimeLeft] = useState(60 * questions.length);

            useEffect(() => {
                setCurrentQuestionIndex(0);
                setSelectedOption(null);
                setScore(0);
                setShowExplanation(false);
                setTimeLeft(60 * questions.length);
            }, [questions]);

            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            finishQuiz(score);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [score, finishQuiz, questions.length]);

            const handleOptionClick = (index) => {
                if (selectedOption !== null) return;
                setSelectedOption(index);
                if (index === questions[currentQuestionIndex].correctAnswer) setScore((prev) => prev + 1);
                setShowExplanation(true);
            };

            const nextQuestion = () => {
                const nextIndex = currentQuestionIndex + 1;
                if (nextIndex < questions.length) {
                    setCurrentQuestionIndex(nextIndex);
                    setSelectedOption(null);
                    setShowExplanation(false);
                } else {
                    finishQuiz(score);
                }
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            };
            
            const handleGoHome = () => {
                if(confirm("ต้องการออกจากหน้าทำข้อสอบหรือไม่? ความคืบหน้าจะไม่ถูกบันทึก")) {
                    goHome();
                }
            };

            if (questions.length === 0) return <div className="min-h-screen flex items-center justify-center text-slate-500 font-bold text-xl">ไม่พบข้อสอบในระบบ</div>;
            const currentQ = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;

            return (
                <div className="min-h-screen p-3 md:p-4 flex flex-col items-center justify-start pt-4 md:pt-8 pb-8">
                    <div className="w-full max-w-3xl bg-white/90 backdrop-blur-xl p-3 md:p-4 rounded-2xl md:rounded-3xl shadow-lg mb-4 md:mb-8 flex justify-between items-center border border-white/50 z-10 sticky top-2 md:top-4">
                        <div className="flex items-center gap-2 md:gap-3">
                            <span className="hidden sm:inline-block bg-gradient-to-r from-slate-800 to-slate-900 text-white px-3 py-1 md:px-4 md:py-1.5 rounded-full text-[10px] md:text-xs font-bold shadow-md tracking-wide">
                                {partName}
                            </span>
                            <span className="text-slate-600 font-semibold text-xs md:text-sm">
                                ข้อที่ <span className="text-blue-600 text-base md:text-lg">{currentQuestionIndex + 1}</span> <span className="text-gray-400">/ {questions.length}</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-3">
                             <div className={`flex items-center gap-1 md:gap-2 font-mono text-base md:text-xl font-bold px-3 py-1 md:px-4 rounded-xl ${timeLeft < 60 ? 'bg-red-50 text-red-500 animate-pulse border border-red-100' : 'bg-slate-50 text-slate-700 border border-slate-100'}`}>
                                <Icons.Clock size={16} className="md:w-5 md:h-5" />
                                {formatTime(timeLeft)}
                            </div>
                            <button onClick={handleGoHome} className="p-2 bg-slate-100 text-slate-500 rounded-xl hover:bg-red-50 hover:text-red-500 transition-colors" title="กลับหน้าหลัก">
                                <Icons.Home size={20} />
                            </button>
                        </div>
                    </div>

                    <div className="w-full max-w-3xl bg-white/95 backdrop-blur-xl p-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] shadow-2xl relative overflow-hidden z-10 border border-white/60 animate-fade-in-up">
                        <div className="absolute top-0 left-0 w-full h-1.5 md:h-2 bg-gray-100">
                            <div className="bg-gradient-to-r from-blue-500 to-indigo-600 h-full transition-all duration-700 ease-out" style={{ width: `${progress}%` }}></div>
                        </div>

                        <div className="mb-6 md:mb-8 mt-2 md:mt-4">
                            <span className="inline-block text-[10px] md:text-xs font-bold tracking-wider text-indigo-500 bg-indigo-50 px-2 py-1 md:px-3 rounded-lg uppercase mb-2 md:mb-4 border border-indigo-100">
                                {currentQ.category}
                            </span>
                            <h2 className="text-lg sm:text-xl md:text-3xl font-bold text-gray-800 leading-relaxed">
                                {currentQ.question}
                            </h2>
                        </div>

                        <div className="space-y-3 md:space-y-4">
                            {currentQ.options.map((option, idx) => {
                                let btnClass = "w-full text-left p-4 md:p-5 rounded-xl md:rounded-2xl border-2 transition-all duration-300 relative group text-base md:text-lg font-medium active:scale-[0.99] ";
                                if (selectedOption === null) {
                                    btnClass += "border-transparent bg-slate-50 hover:bg-white hover:border-blue-300 hover:shadow-lg hover:-translate-y-1 text-slate-600";
                                } else {
                                    if (idx === currentQ.correctAnswer) btnClass += "border-green-400 bg-green-50/50 text-green-800 shadow-md";
                                    else if (idx === selectedOption) btnClass += "border-red-400 bg-red-50/50 text-red-800";
                                    else btnClass += "border-transparent bg-slate-50 text-slate-300 opacity-60 grayscale";
                                }
                                return (
                                    <button key={idx} onClick={() => handleOptionClick(idx)} disabled={selectedOption !== null} className={btnClass}>
                                        <span className="flex items-center justify-between">
                                            <span>{idx + 1}. {option}</span>
                                            {selectedOption !== null && idx === currentQ.correctAnswer && <Icons.CheckCircle className="text-green-500" size={20} />}
                                            {selectedOption === idx && idx !== currentQ.correctAnswer && <Icons.XCircle className="text-red-500" size={20} />}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>

                        {showExplanation && (
                            <div className="mt-6 md:mt-8 overflow-hidden rounded-xl md:rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 animate-fade-in-up">
                                <div className="p-4 md:p-6">
                                    <h3 className="font-bold text-blue-800 mb-2 flex items-center gap-2 text-base md:text-lg">
                                        <Icons.Lightbulb size={20} className="text-yellow-500 md:w-6 md:h-6" /> คำอธิบาย
                                    </h3>
                                    <p className="text-slate-700 text-sm md:text-base leading-relaxed pl-7 md:pl-8">{currentQ.explanation}</p>
                                </div>
                                <div className="bg-blue-100/50 p-3 md:p-4 flex justify-end border-t border-blue-100">
                                    <button onClick={nextQuestion} className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white px-6 py-2 md:px-8 md:py-3 rounded-lg md:rounded-xl font-bold hover:shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2 shadow-blue-500/30 text-sm md:text-base">
                                        ข้อถัดไป <Icons.ArrowRight size={18} className="md:w-5 md:h-5" />
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const ResultScreen = ({ score, total, restartQuiz, goHome, partName }) => {
            const percentage = total > 0 ? (score / total) * 100 : 0;
            const isPassed = percentage >= 60;
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white/95 backdrop-blur-2xl p-6 md:p-12 rounded-[2rem] md:rounded-[3rem] shadow-2xl max-w-lg w-full text-center relative overflow-hidden border border-white/60 animate-pop-in">
                        <div className={`absolute top-0 left-0 w-full h-1.5 md:h-2 bg-gradient-to-r ${isPassed ? 'from-green-400 to-emerald-500' : 'from-red-400 to-orange-500'}`}></div>
                        <div className="relative mb-4 md:mb-6">
                            <div className={`w-24 h-24 md:w-32 md:h-32 mx-auto rounded-full bg-gradient-to-br ${isPassed ? 'from-green-100 to-emerald-50 border-4 border-green-200' : 'from-red-100 to-orange-50 border-4 border-red-200'} shadow-xl flex items-center justify-center`}>
                                {isPassed ? <Icons.Trophy size={48} className="text-green-600 md:w-16 md:h-16" /> : <Icons.Frown size={48} className="text-red-500 md:w-16 md:h-16" />}
                            </div>
                        </div>
                        <span className="inline-block px-3 py-1 bg-slate-100 text-slate-500 rounded-full text-[10px] md:text-xs font-bold uppercase tracking-wider mb-2 md:mb-4 border border-slate-200">{partName}</span>
                        <h2 className={`text-2xl md:text-3xl font-extrabold mb-1 md:mb-2 ${isPassed ? 'text-green-700' : 'text-red-600'}`}>{isPassed ? "สอบผ่าน!" : "สอบไม่ผ่าน"}</h2>
                        <p className="text-slate-500 mb-6 md:mb-8 font-medium text-sm md:text-base">{isPassed ? "ยินดีด้วย คุณมีความพร้อมสำหรับการสอบจริง" : "ไม่ต้องเสียใจ ลองทบทวนเนื้อหาและสอบใหม่อีกครั้ง"}</p>
                        <div className="flex justify-center gap-3 md:gap-4 mb-8 md:mb-10">
                            <div className="bg-slate-50 p-3 md:p-5 rounded-2xl md:rounded-3xl border border-slate-100 w-24 md:w-32 shadow-sm">
                                <span className="block text-slate-400 text-[10px] md:text-xs font-bold mb-1">คะแนน</span>
                                <span className="block text-2xl md:text-4xl font-black text-slate-800">{score}</span>
                            </div>
                            <div className="bg-slate-50 p-3 md:p-5 rounded-2xl md:rounded-3xl border border-slate-100 w-24 md:w-32 shadow-sm">
                                <span className="block text-slate-400 text-[10px] md:text-xs font-bold mb-1">จากเต็ม</span>
                                <span className="block text-2xl md:text-4xl font-black text-slate-400">{total}</span>
                            </div>
                        </div>
                        <div className="space-y-3 relative z-10">
                            <button onClick={restartQuiz} className="w-full bg-slate-800 text-white font-bold py-3 md:py-4 rounded-xl md:rounded-2xl hover:bg-slate-900 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm md:text-base"><Icons.RotateCcw size={18} className="md:w-5 md:h-5" /> ทำข้อสอบใหม่อีกครั้ง</button>
                            <button onClick={goHome} className="w-full bg-white border-2 border-slate-200 text-slate-600 font-bold py-3 md:py-4 rounded-xl md:rounded-2xl hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm md:text-base"><Icons.Home size={18} className="md:w-5 md:h-5" /> กลับหน้าหลัก</button>
                        </div>
                    </div>
                </div>
            );
        };

        const EditModal = ({ question, onClose, onSave }) => {
            const [formData, setFormData] = useState(question);

            const handleChange = (field, value) => setFormData(prev => ({ ...prev, [field]: value }));
            const handleOptionChange = (idx, value) => {
                const newOptions = [...formData.options];
                newOptions[idx] = value;
                setFormData(prev => ({ ...prev, options: newOptions }));
            };

            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl animate-pop-in border border-slate-200">
                        <div className="sticky top-0 bg-white z-10 p-4 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="text-xl font-bold flex items-center gap-2 text-slate-700">
                                <div className="bg-blue-100 p-2 rounded-lg text-blue-600"><Icons.Edit size={20} /></div>
                                แก้ไขข้อสอบ
                            </h3>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors"><Icons.X size={20} /></button>
                        </div>
                        <div className="p-6 space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">ส่วน (Part)</label>
                                    <select value={formData.part} onChange={e => handleChange('part', e.target.value)} className="w-full p-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none">
                                        <option value="A">ภาค ก</option>
                                        <option value="B">ภาค ข</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 mb-1">หมวดหมู่</label>
                                    <input type="text" value={formData.category} onChange={e => handleChange('category', e.target.value)} className="w-full p-2 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">โจทย์คำถาม</label>
                                <textarea value={formData.question} onChange={e => handleChange('question', e.target.value)} rows="3" className="w-full p-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none resize-none"></textarea>
                            </div>
                            <div className="space-y-2">
                                <label className="block text-xs font-bold text-slate-500">ตัวเลือก</label>
                                {formData.options.map((opt, idx) => (
                                    <div key={idx} className="flex items-center gap-2">
                                        <span className="text-sm font-bold text-slate-400 w-6">{idx+1}.</span>
                                        <input type="text" value={opt} onChange={e => handleOptionChange(idx, e.target.value)} className="flex-1 p-2 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm" />
                                        <input type="radio" name="correct" checked={formData.correctAnswer === idx} onChange={() => handleChange('correctAnswer', idx)} className="w-4 h-4 text-green-500" />
                                    </div>
                                ))}
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">คำอธิบายเฉลย</label>
                                <textarea value={formData.explanation} onChange={e => handleChange('explanation', e.target.value)} rows="2" className="w-full p-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none resize-none bg-slate-50"></textarea>
                            </div>
                        </div>
                        <div className="p-4 border-t border-slate-100 flex justify-end gap-2 bg-slate-50 sticky bottom-0">
                            <button onClick={onClose} className="px-4 py-2 text-slate-500 font-bold hover:bg-slate-200 rounded-xl transition-colors">ยกเลิก</button>
                            <button onClick={() => onSave(formData)} className="px-6 py-2 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all active:scale-95">บันทึกการแก้ไข</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminScreen = ({ goBack, onAddQuestions, questions, onSeedData, isSaving, onDeleteQuestion, onUpdateQuestion }) => {
            const [previewData, setPreviewData] = useState([]);
            const [errorMsg, setErrorMsg] = useState("");
            const [searchTerm, setSearchTerm] = useState("");
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [importPart, setImportPart] = useState('A'); // State for selected part
            const fileInputRef = useRef(null);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = parseCSV(event.target.result);
                        if (parsed.length === 0) {
                            setErrorMsg("ไม่พบข้อมูล หรือรูปแบบไฟล์ไม่ถูกต้อง");
                            setPreviewData([]);
                        } else {
                            // Apply the selected part to all imported items
                            const parsedWithPart = parsed.map(item => ({
                                ...item,
                                part: importPart
                            }));
                            setPreviewData(parsedWithPart);
                            setErrorMsg("");
                        }
                    } catch (err) {
                        setErrorMsg("เกิดข้อผิดพลาดในการอ่านไฟล์");
                    }
                };
                reader.readAsText(file);
            };

            const handleSaveImport = async () => {
                if (previewData.length > 0) {
                    await onAddQuestions(previewData);
                    setPreviewData([]);
                    if(fileInputRef.current) fileInputRef.current.value = "";
                }
            };

            const handleUpdate = async (updatedData) => {
                await onUpdateQuestion(updatedData.id, updatedData);
                setEditingQuestion(null);
            };

            const filteredQuestions = questions.filter(q => 
                q.question.toLowerCase().includes(searchTerm.toLowerCase()) || 
                q.category.toLowerCase().includes(searchTerm.toLowerCase())
            );

            return (
                <div className="min-h-screen p-4 overflow-y-auto pb-20">
                    <div className="max-w-6xl mx-auto space-y-6">
                        {/* Header */}
                        <div className="bg-white/90 backdrop-blur-xl rounded-[2rem] p-6 shadow-xl border border-white/60 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-3">
                                <div className="bg-blue-100 p-2.5 rounded-xl text-blue-600 shadow-sm"><Icons.Settings size={28} /></div>
                                ระบบจัดการข้อสอบ
                            </h2>
                            <button onClick={goBack} className="bg-white border-2 border-slate-100 text-slate-600 hover:text-slate-900 hover:border-slate-300 px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 font-bold text-sm shadow-sm hover:shadow active:scale-95">
                                <Icons.ArrowLeft size={18} /> กลับหน้าหลัก
                            </button>
                        </div>

                        {/* Import Section */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-8 rounded-[2rem] shadow-xl shadow-blue-500/20 flex flex-col items-center justify-center text-center col-span-1 relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-3xl -mr-10 -mt-10 group-hover:scale-150 transition-transform duration-700"></div>
                                <Icons.Database size={40} className="mb-4 opacity-90 drop-shadow-md" />
                                <h3 className="text-blue-100 font-medium mb-1">ข้อสอบทั้งหมดในระบบ</h3>
                                <p className="text-5xl font-black tracking-tight">{questions.length}</p>
                                <span className="mt-4 text-[10px] bg-white/20 px-3 py-1 rounded-full backdrop-blur-md">Updated Real-time</span>
                            </div>

                            <div className="bg-white p-6 md:p-8 rounded-[2rem] shadow-xl border border-slate-100 col-span-1 md:col-span-2 relative">
                                <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-slate-700">
                                    <div className="bg-indigo-100 p-1.5 rounded-lg text-indigo-600"><Icons.UploadCloud size={20} /></div>
                                    นำเข้าข้อสอบ (CSV)
                                </h3>

                                <div className="mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                    <label className="block text-xs font-bold text-slate-500 mb-2">เลือกภาควิชาสำหรับไฟล์นี้:</label>
                                    <div className="flex gap-4">
                                        <label className="flex items-center gap-2 cursor-pointer hover:bg-white p-2 rounded-lg transition-colors border border-transparent hover:border-slate-200">
                                            <input 
                                                type="radio" 
                                                name="importPart" 
                                                value="A" 
                                                checked={importPart === 'A'} 
                                                onChange={(e) => setImportPart(e.target.value)} 
                                                className="w-4 h-4 text-blue-600" 
                                            />
                                            <span className="text-sm font-bold text-blue-700">ภาค ก</span>
                                        </label>
                                        <label className="flex items-center gap-2 cursor-pointer hover:bg-white p-2 rounded-lg transition-colors border border-transparent hover:border-slate-200">
                                            <input 
                                                type="radio" 
                                                name="importPart" 
                                                value="B" 
                                                checked={importPart === 'B'} 
                                                onChange={(e) => setImportPart(e.target.value)} 
                                                className="w-4 h-4 text-purple-600" 
                                            />
                                            <span className="text-sm font-bold text-purple-700">ภาค ข</span>
                                        </label>
                                    </div>
                                </div>
                                
                                <div className="flex flex-col sm:flex-row gap-4 mb-4">
                                    <div className="relative flex-1 group">
                                        <input type="file" accept=".csv" onChange={handleFileChange} ref={fileInputRef} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-slate-200 rounded-xl bg-slate-50 focus:outline-none focus:border-blue-400 transition-colors py-2 px-3"/>
                                    </div>
                                    {questions.length === 0 && <button onClick={onSeedData} className="px-4 py-2 bg-amber-50 text-amber-600 rounded-xl font-bold text-sm flex items-center justify-center gap-2 hover:bg-amber-100 transition-colors border border-amber-200"><Icons.RefreshCw size={16} /> โหลดตัวอย่าง</button>}
                                </div>

                                {previewData.length > 0 && (
                                    <div className="animate-fade-in-up bg-green-50 p-4 rounded-2xl border border-green-100 flex justify-between items-center">
                                        <div className="text-green-800 text-sm font-bold flex items-center gap-2"><Icons.CheckCircle size={18} /> พร้อมนำเข้า {previewData.length} ข้อ</div>
                                        <button onClick={handleSaveImport} disabled={isSaving} className="bg-green-600 text-white px-5 py-2 rounded-xl font-bold hover:bg-green-700 shadow-lg shadow-green-500/20 flex items-center gap-2 active:scale-95 text-sm transition-all">{isSaving ? <Icons.Loader2 size={16} className="animate-spin" /> : <Icons.Save size={16} />} ยืนยัน</button>
                                    </div>
                                )}
                                {errorMsg && <div className="bg-red-50 text-red-600 p-3 rounded-xl mt-2 border border-red-100 flex items-center gap-2 text-sm animate-shake"><Icons.AlertCircle size={18} /> {errorMsg}</div>}
                            </div>
                        </div>

                        {/* Management Table Section */}
                        <div className="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col min-h-[500px]">
                            <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50/50">
                                <h3 className="font-bold text-lg text-slate-700 flex items-center gap-2">
                                    <div className="bg-orange-100 p-1.5 rounded-lg text-orange-600"><Icons.BookOpen size={20} /></div>
                                    จัดการรายการข้อสอบ
                                </h3>
                                <div className="relative w-full sm:w-64">
                                    <Icons.Search size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                    <input 
                                        type="text" 
                                        placeholder="ค้นหาโจทย์ หรือ หมวดหมู่..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:border-blue-400 focus:ring-4 focus:ring-blue-50 outline-none text-sm bg-white"
                                    />
                                </div>
                            </div>
                            
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full text-left text-slate-600">
                                    <thead className="bg-slate-50 text-xs uppercase font-bold text-slate-500 sticky top-0 z-10 shadow-sm">
                                        <tr>
                                            <th className="px-6 py-4 rounded-tl-2xl">วันที่อัพโหลด</th>
                                            <th className="px-6 py-4">ส่วน</th>
                                            <th className="px-6 py-4">โจทย์</th>
                                            <th className="px-6 py-4 text-right rounded-tr-2xl">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 text-sm">
                                        {filteredQuestions.length === 0 ? (
                                            <tr><td colSpan="4" className="text-center py-10 text-slate-400">ไม่พบข้อมูล</td></tr>
                                        ) : (
                                            filteredQuestions.map((q) => (
                                                <tr key={q.id} className="hover:bg-blue-50/30 transition-colors group">
                                                    <td className="px-6 py-4 whitespace-nowrap text-slate-400 text-xs font-mono">
                                                        {new Date(q.createdAt).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' })}
                                                    </td>
                                                    <td className="px-6 py-4">
                                                        <div className="flex flex-col items-start gap-1">
                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${q.part === 'A' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>
                                                                ภาค {q.part}
                                                            </span>
                                                            <span className="text-xs text-slate-500">{q.category}</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 max-w-md">
                                                        <div className="font-medium text-slate-800 line-clamp-1 mb-1">{q.question}</div>
                                                        <div className="text-xs text-slate-400 flex gap-2">
                                                            <span>ตัวเลือก: {q.options.join(', ')}</span>
                                                        </div>
                                                    </td>
                                                    <td className="px-6 py-4 text-right">
                                                        <div className="flex items-center justify-end gap-2 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                            <button 
                                                                onClick={() => setEditingQuestion(q)}
                                                                className="p-2 bg-white border border-slate-200 text-blue-600 rounded-lg hover:bg-blue-50 hover:border-blue-200 transition-colors shadow-sm" 
                                                                title="แก้ไข"
                                                            >
                                                                <Icons.Edit size={16} />
                                                            </button>
                                                            <button 
                                                                onClick={() => { if(confirm('ต้องการลบข้อสอบนี้ใช่หรือไม่?')) onDeleteQuestion(q.id); }}
                                                                className="p-2 bg-white border border-slate-200 text-red-500 rounded-lg hover:bg-red-50 hover:border-red-200 transition-colors shadow-sm" 
                                                                title="ลบ"
                                                            >
                                                                <Icons.Trash2 size={16} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    {editingQuestion && <EditModal question={editingQuestion} onClose={() => setEditingQuestion(null)} onSave={handleUpdate} />}
                </div>
            );
        };

        // --- Main App ---
        const App = () => {
            const [gameState, setGameState] = useState('welcome'); 
            const [score, setScore] = useState(0);
            const [questions, setQuestions] = useState([]); 
            const [selectedPart, setSelectedPart] = useState(null); 
            const [partQuestions, setPartQuestions] = useState([]); // Store questions for selected part
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [user, setUser] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [authError, setAuthError] = useState(null);
            
            const { auth, db, appId, signInAnonymously, onAuthStateChanged, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, signInWithCustomToken } = window.FB;

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        setAuthError(error.message);
                        setIsLoading(false);
                    }
                };
                if (window.FB) initAuth();
                else window.addEventListener('firebase-ready', initAuth);

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) setAuthError(null);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const questionsPath = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                const userQuestionsQuery = query(questionsPath);
                const unsubscribe = onSnapshot(userQuestionsQuery, (snapshot) => {
                    const loadedQuestions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // Sort by createdAt desc (Newest first)
                    loadedQuestions.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    setQuestions(loadedQuestions);
                    setIsLoading(false);
                }, (error) => {
                    setAuthError("เชื่อมต่อฐานข้อมูลไม่ได้");
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [user]);

            const handleSelectPart = (part) => {
                const filtered = questions.filter(q => q.part === part);
                if(filtered.length === 0) { alert("ยังไม่มีข้อสอบในหมวดนี้"); return; }
                setSelectedPart(part);
                setPartQuestions(filtered); // Save filtered questions
                setGameState('selection'); // Go to selection screen instead of quiz
            };

            const handleSelectSet = (setIndex) => {
                const start = setIndex * QUESTIONS_PER_SET;
                const end = start + QUESTIONS_PER_SET;
                const setQuestions = partQuestions.slice(start, end);
                setActiveQuestions(setQuestions);
                setScore(0);
                setGameState('quiz');
            };

            const addQuestionsToDB = async (newQuestions) => {
                if (!user) return;
                setIsSaving(true);
                try {
                    const questionsCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
                    for (const q of newQuestions) await addDoc(questionsCol, q);
                    alert(`บันทึกสำเร็จ ${newQuestions.length} ข้อ`);
                } catch (error) {
                    alert("เกิดข้อผิดพลาดในการบันทึก");
                } finally {
                    setIsSaving(false);
                }
            };

            const deleteQuestion = async (id) => {
                if (!user) return;
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', id));
                } catch (e) {
                    alert("ลบไม่สำเร็จ: " + e.message);
                }
            };

            const updateQuestion = async (id, newData) => {
                if (!user) return;
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', id), newData);
                } catch (e) {
                    alert("แก้ไขไม่สำเร็จ: " + e.message);
                }
            };

            const handleSeedData = async () => {
                if(confirm("โหลดข้อมูลตัวอย่าง?")) await addQuestionsToDB(INITIAL_QUESTIONS);
            };

            const questionCounts = { A: questions.filter(q => q.part === 'A').length, B: questions.filter(q => q.part === 'B').length };
            
            // Helper function to get part name safely
            const getPartName = (part) => {
                return part === 'A' ? "ภาค ก (ความรู้ทั่วไป)" : "ภาค ข (ความรู้เฉพาะตำแหน่ง)";
            };

            return (
                <div>
                    <div className="fixed inset-0 bg-slate-50 -z-20"></div>
                    <div className="fixed inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-200/40 via-purple-200/40 to-transparent -z-10 animate-pulse-slow"></div>
                    <div className="fixed inset-0 bg-[radial-gradient(ellipse_at_bottom_left,_var(--tw-gradient-stops))] from-indigo-200/40 via-cyan-200/40 to-transparent -z-10 animate-pulse-slow delay-1000"></div>

                    {gameState === 'welcome' && <WelcomeScreen onSelectPart={handleSelectPart} goToAdmin={() => setGameState('admin')} questionCounts={questionCounts} isLoading={isLoading} authError={authError} />}
                    {gameState === 'selection' && <SelectionScreen questions={partQuestions} onSelectSet={handleSelectSet} onBack={() => setGameState('welcome')} partName={getPartName(selectedPart)} />}
                    {gameState === 'quiz' && <QuizScreen questions={activeQuestions} finishQuiz={(s) => { setScore(s); setGameState('result'); }} partName={getPartName(selectedPart)} goHome={() => setGameState('welcome')} />}
                    {gameState === 'result' && <ResultScreen score={score} total={activeQuestions.length} restartQuiz={() => { setScore(0); setGameState('quiz'); }} goHome={() => { setGameState('welcome'); setSelectedPart(null); }} partName={getPartName(selectedPart)} />}
                    {gameState === 'admin' && (
                        <AdminScreen 
                            goBack={() => setGameState('welcome')} 
                            onAddQuestions={addQuestionsToDB} 
                            questions={questions}
                            onSeedData={handleSeedData} 
                            isSaving={isSaving}
                            onDeleteQuestion={deleteQuestion}
                            onUpdateQuestion={updateQuestion}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
